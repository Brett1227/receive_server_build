name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the verified executable as the v1.2 Release"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "source/receive_server_v1.0.py"

permissions:
  contents: write

jobs:
  build:
    name: Build receive_server v1.2
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.15" qrcode pillow openpyxl

      - name: Verify GUI dependencies
        shell: pwsh
        run: |
          python -c "import tkinter, qrcode, PIL, openpyxl; print('Tk', tkinter.TkVersion, 'dependencies OK')"

      - name: Build windowed executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name receive_server_v1.2 source/receive_server_v1.0.py

      - name: Run packaged dependency self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/receive_server_v1.2.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath "dist/error.log") {
              Get-Content -LiteralPath "dist/error.log"
            }
            throw "Packaged dependency self-test failed with exit code $($process.ExitCode)"
          }
          Write-Output "PACKAGED_DEPENDENCY_SELF_TEST=PASS"

      - name: Run packaged GUI startup smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/receive_server_v1.2.exe" -ArgumentList "--gui-smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath "dist/error.log") {
              Get-Content -LiteralPath "dist/error.log"
            }
            throw "Packaged GUI startup smoke test failed with exit code $($process.ExitCode)"
          }
          Write-Output "PACKAGED_GUI_SMOKE_TEST=PASS"

      - name: Verify output and checksum
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/receive_server_v1.2.exe")) {
            throw "Expected executable was not created"
          }
          $file = Get-Item -LiteralPath "dist/receive_server_v1.2.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
          Write-Output "EXE_NAME=$($file.Name)"
          Write-Output "EXE_SIZE=$($file.Length)"
          Write-Output "EXE_SHA256=$hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: receive_server-v1.2-windows
          path: dist/receive_server_v1.2.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish v1.2 Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release v1.2 already exists; skipping publication."
            exit 0
          }

          $file = Get-Item -LiteralPath "dist/receive_server_v1.2.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
          $notes = @"
          ## receive_server v1.2

          本版本修复并优化了不同分辨率和 Windows 缩放比例下的桌面窗口布局。

          ### 主要变化

          - 根据当前屏幕逻辑分辨率计算初始窗口大小并自动居中
          - 二维码根据屏幕高度智能缩放
          - 降低固定最小高度，适配笔记本小屏幕
          - 增加完整页面滚动条和鼠标滚轮支持
          - 确保可以滚动到“打开上传记录”按钮
          - 增加打包依赖自检模式
          - 使用 GitHub Actions、Python 3.14 和 PyInstaller 可重复构建

          ### 下载与校验

          - 文件：`receive_server_v1.2.exe`
          - 大小：$($file.Length) 字节
          - SHA-256：`$hash`

          Windows 可能对未签名程序显示安全提示。请仅从本 Release 下载，并核对 SHA-256。
          "@
          Set-Content -LiteralPath "release-notes-v1.2.md" -Value $notes -Encoding utf8
          gh release create v1.2 "dist/receive_server_v1.2.exe#receive_server_v1.2.exe" --target "$env:GITHUB_SHA" --title "receive_server v1.2" --notes-file "release-notes-v1.2.md" --latest
